name: Deploy

# Push to main → live site. Pull requests → a private preview URL posted on the PR.
# A rebuild every 2 hours keeps the Shows list current from the Music calendar.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 */2 * * *" # every 2 hours, so new calendar entries show up quickly
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test against the fixture calendar
        run: SHOWS_FIXTURE=tests/fixtures/music.ics npm run build && npm test
        env:
          PUBLIC_FEEDBACK_API_KEY: ${{ vars.FEEDBACK_API_KEY }}
      - run: npm run build
        env:
          MUSIC_CALENDAR_ID: ${{ vars.MUSIC_CALENDAR_ID }}
          GOOGLE_CALENDAR_API_KEY: ${{ secrets.GOOGLE_CALENDAR_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.CALENDAR_SERVICE_ACCOUNT }}
          PUBLIC_FEEDBACK_API_KEY: ${{ vars.FEEDBACK_API_KEY }}
      - uses: actions/setup-java@v5
        if: github.event_name != 'schedule'
        with:
          distribution: temurin
          java-version: 21
      - name: Firestore rules tests (emulator)
        if: github.event_name != 'schedule'
        # Mix review rules (tests/rules/): every client and admin read / write against the Firestore emulator.
        # Failing tests show up as annotations on the PR; the emulator's own log is printed on failure.
        run: npm run test:rules || { tail -n 80 firestore-debug.log 2>/dev/null; exit 1; }
      - name: Deploy Firestore rules (main)
        if: github.event_name != 'pull_request'
        # Before hosting goes live, so new pages never ship ahead of the rules they rely on.
        # Needs the Firebase Rules Admin role on the deploy service account; a failure is a warning, not a stop.
        continue-on-error: true
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          if ! GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx firebase deploy --only firestore:rules --project tritone-site --non-interactive; then
            echo "::warning title=Firestore rules not deployed::Grant the deploy service account (FIREBASE_SERVICE_ACCOUNT) the Firebase Rules Admin role (roles/firebaserules.admin) on project tritone-site, then re-run this workflow or run 'firebase deploy --only firestore:rules' by hand. Hosting still deploys."
            exit 1
          fi
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy preview (pull request)
        if: github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: tritone-site
          expires: 14d
      - name: Deploy live (main)
        if: github.event_name != 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: tritone-site
          channelId: live
      - name: Ping IndexNow (Bing and friends)
        if: github.event_name == 'push'
        run: node scripts/indexnow.mjs

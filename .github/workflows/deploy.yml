name: Deploy

# Push to main → live site. Pull requests → a private preview URL posted on the PR.
# A rebuild every 2 hours keeps the Shows list current from the Music calendar.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 */2 * * *" # every 2 hours, so new calendar entries show up quickly
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          MUSIC_CALENDAR_ID: ${{ vars.MUSIC_CALENDAR_ID }}
          GOOGLE_CALENDAR_API_KEY: ${{ secrets.GOOGLE_CALENDAR_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.CALENDAR_SERVICE_ACCOUNT }}
      - name: Deploy preview (pull request)
        if: github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: tritone-site
          expires: 14d
      - name: Deploy live (main)
        if: github.event_name != 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: tritone-site
          channelId: live

name: Weekly analytics digest

# Every Monday: summarise the last 7 days of visitor analytics (Firestore "hits", written by
# src/lib/track.ts) against the 7 before, store the digest in Firestore collection "digests"
# (read by Scott's /admin dashboard, nobody else) and keep the Markdown as a workflow artifact.
# This repository is public, so the digest is never written to an issue, a comment or the job
# summary. The service account needs roles/datastore.user (read hits, write digests).
on:
  schedule:
    - cron: "0 15 * * 1" # Monday 15:00 UTC (8 am Pacific in summer, 7 am in winter)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analytics-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build the digest and store it in Firestore
        run: |
          GOOGLE_ACCESS_TOKEN="$(gcloud auth print-access-token)" node scripts/analytics-digest.mjs analytics-digest.md > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: analytics-digest
          path: analytics-digest.md
          if-no-files-found: error
          retention-days: 90
